<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Wplace Archive Viewer</title>
	<link rel="stylesheet" href="/wplace-archive-viewer.css">
	<link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.7.2/css/all.css">

	<script type="module">
		function to_local_date(date) {
			const day = date.slice(0, 10).replaceAll("_", "-");
			const hour = date.slice(11, 13);
			return new Date(`${day} ${hour}:00 UTC`);
		}

		function to_basic_date(date) {
			return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
		}

		const cache = {};
		async function get_chunk(x, y, date) {
			const cached = cache[`${x}-${y}-${date}`];
			if (cached === undefined) {
				cache[`${x}-${y}-${date}`] = new Promise((resolve, reject) => {
					const img = new Image();
					img.crossOrigin = "anonymous";
					img.addEventListener("load", () => {
						cache[`${x}-${y}-${date}`] = img;
						resolve(img);
					});
					img.addEventListener("error", () => reject());
					img.src = `https://wplace-archive.lila.ws/${x}/${y}/${date}.webp`;
				});
				return await cache[`${x}-${y}-${date}`];
			} else if (cached instanceof Promise) {
				return await cached;
			} else {
				return cached;
			}
		}

		const canvas = document.getElementById("drawing_canvas");
		canvas.width = window.innerWidth;
		canvas.height = window.innerHeight;
		const context = canvas.getContext("2d");
		context.imageSmoothingEnabled = false;

		const chunks = await(await fetch("https://wplace-archive.lila.ws/api/chunks")).json();

		const x_sorted = chunks.map(x => x[0]).toSorted();
		const y_sorted = chunks.map(x => x[1]).toSorted();
		const start = [x_sorted[0] * 1000, y_sorted[0] * 1000];
		const end = [x_sorted[x_sorted.length - 1] * 1000, y_sorted[y_sorted.length - 1] * 1000];

		const dates = await(await fetch(`https://wplace-archive.lila.ws/api/history/${x_sorted[0]}/${y_sorted[0]}`)).json();
		const min_date = to_local_date(dates[0]);
		const current_max_date = to_local_date(dates[dates.length - 1]);

		// Archive date management
		let selectedDate = to_basic_date(current_max_date);
		let selectedHour = current_max_date.getHours().toString();

		// Format date for URL (YYYY_MM_DD_HH)
		function formatDateForURL(date, hour) {
			const dateObj = new Date(`${date} ${hour}:00`);
			const year = dateObj.getUTCFullYear();
			const month = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
			const day = String(dateObj.getUTCDate()).padStart(2, '0');
			const formattedHour = String(dateObj.getUTCHours()).padStart(2, '0');
			return `${year}_${month}_${day}_${formattedHour}`;
		}

		const position = start.slice();
		let zoom = 0.5;
		function paint() {
			const min_chunk = [
				Math.floor(position[0] / 1000),
				Math.floor(position[1] / 1000)
			];
			const max_chunk = [
				Math.floor((position[0] + canvas.width * (1 / zoom)) / 1000),
				Math.floor((position[1] + canvas.height * (1 / zoom)) / 1000)
			];

			for (let y = min_chunk[1]; y <= max_chunk[1]; y++) {
				for (let x = min_chunk[0]; x <= max_chunk[0]; x++) {
					const formattedDate = formatDateForURL(selectedDate, selectedHour);
					const pixel_x = x * 1000 - position[0];
					const pixel_y = y * 1000 - position[1];

					get_chunk(x, y, formattedDate).then(img => {
						context.save();
						context.scale(zoom, zoom);
						context.drawImage(img, pixel_x, pixel_y, 1000.1, 1000.1);
						context.restore();
					}, () => {
						context.save();
						context.scale(zoom, zoom);

						context.fillStyle = "#fb3ef9";
						context.beginPath();
						context.rect(pixel_x, pixel_y, 500, 500);
						context.rect(pixel_x + 500, pixel_y + 500, 500, 500);
						context.fill();

						context.fillStyle = "#000000";
						context.beginPath();
						context.rect(pixel_x + 500, pixel_y, 500, 500);
						context.rect(pixel_x, pixel_y + 500, 500, 500);
						context.fill();

						context.restore();
					});
				}
			}
		}

		let is_dragging = false;
		let last_touch_pos = null;

		// Mouse events (desktop)
		canvas.addEventListener("mousedown", (event) => {
			if (screenshotMode) {
				startScreenshotSelection(event);
			} else {
				is_dragging = true;
			}
		});
		canvas.addEventListener("mouseup", () => {
			if (screenshotMode) {
				endScreenshotSelection();
			} else {
				is_dragging = false;
			}
		});
		canvas.addEventListener("mouseleave", () => {
			if (screenshotMode) {
				endScreenshotSelection();
			} else {
				is_dragging = false;
			}
		})
		canvas.addEventListener("mousemove", event => {
			if (screenshotMode && isSelectingScreenshot) {
				updateScreenshotSelection(event);
			} else if (is_dragging) {
				position[0] -= event.movementX * (1 / zoom);
				position[1] -= event.movementY * (1 / zoom);
				position[0] = Math.max(start[0], Math.min(end[0] - canvas.width * (1 / zoom), position[0]));
				position[1] = Math.max(start[1], Math.min(end[1] - canvas.height * (1 / zoom), position[1]));
				context.clearRect(0, 0, canvas.width, canvas.height);
				paint();
			}
		});

		// Touch events (mobile)
		canvas.addEventListener("touchstart", event => {
			event.preventDefault();
			if (screenshotMode) {
				// Not implementing touch for screenshot for simplicity
			} else {
				is_dragging = true;
				const touch = event.touches[0];
				last_touch_pos = { x: touch.clientX, y: touch.clientY };
			}
		});

		canvas.addEventListener("touchend", event => {
			event.preventDefault();
			if (screenshotMode) {
				// Not implementing touch for screenshot for simplicity
			} else {
				is_dragging = false;
				last_touch_pos = null;
			}
		});

		canvas.addEventListener("touchmove", event => {
			event.preventDefault();
			if (screenshotMode) {
				// Not implementing touch for screenshot for simplicity
			} else if (is_dragging && last_touch_pos && event.touches.length === 1) {
				const touch = event.touches[0];
				const movementX = touch.clientX - last_touch_pos.x;
				const movementY = touch.clientY - last_touch_pos.y;

				position[0] -= movementX * (1 / zoom);
				position[1] -= movementY * (1 / zoom);
				position[0] = Math.max(start[0], Math.min(end[0] - canvas.width * (1 / zoom), position[0]));
				position[1] = Math.max(start[1], Math.min(end[1] - canvas.height * (1 / zoom), position[1]));

				last_touch_pos = { x: touch.clientX, y: touch.clientY };

				context.clearRect(0, 0, canvas.width, canvas.height);
				paint();
			}
		}, { passive: false });

		canvas.addEventListener("wheel", event => {
			if (screenshotMode) {
				// Disable zoom in screenshot mode
				return;
			}

			let deltaY = event.deltaY;
			if (event.deltaMode === WheelEvent.DOM_DELTA_LINE) deltaY *= 16;

			const rect = canvas.getBoundingClientRect();
			const x = event.clientX - rect.left;
			const y = event.clientY - rect.top;

			const zoomFactor = 1.001 ** -deltaY;
			const old_zoom = zoom;
			zoom *= zoomFactor;
			zoom = Math.max(0.02, zoom);

			// What we do here:
			// x / old_zoom => "real" (unzoomed) position
			// x / old_zoom * zoom => position with the new zoom
			// x / old_zoom * zoom - x => distance (in pixels) between the old and new pos
			// (x / old_zoom * zoom - x) / zoom => scaled distance
			position[0] += (x / old_zoom * zoom - x) / zoom;
			position[1] += (y / old_zoom * zoom - y) / zoom;

			position[0] = Math.max(start[0], Math.min(end[0] - canvas.width * (1 / zoom), position[0]));
			position[1] = Math.max(start[1], Math.min(end[1] - canvas.height * (1 / zoom), position[1]));

			context.clearRect(0, 0, canvas.width, canvas.height);
			paint();
		}, { passive: true });

		window.addEventListener("resize", () => {
			canvas.width = window.innerWidth;
			canvas.height = window.innerHeight;
			context.imageSmoothingEnabled = false;
			paint();
		});

		paint();

		// ========================= Screenshot Tool =========================
		let screenshotMode = false;
		let isSelectingScreenshot = false;
		let screenshotStartX = 0;
		let screenshotStartY = 0;
		let screenshotEndX = 0;
		let screenshotEndY = 0;
		let selectionRectangle = null;

		// Function to snap coordinates to pixel grid
		function snapToPixelGrid(coord, position) {
			// Calculate the size of a displayed pixel in screen coordinates
			const pixelSize = Math.max(1, zoom);

			const shift = (position % 1) * zoom;
			const screen_aligned = Math.round((coord + shift) / pixelSize) * pixelSize;

			// Snap to the pixel grid
			return Math.round(screen_aligned - shift);
		}

		// Toggle screenshot mode
		function toggleScreenshotMode() {
			screenshotMode = !screenshotMode;

			if (screenshotMode) {
				document.getElementById('screenshotTool').classList.add('active');
				document.getElementById('screenshotBtn').innerHTML = '<i class="fas fa-times"></i>';
				document.getElementById('screenshotBtn').title = "Cancel Screenshot";
				canvas.style.cursor = "crosshair";
			} else {
				document.getElementById('screenshotTool').classList.remove('active');
				document.getElementById('screenshotBtn').innerHTML = '<i class="fas fa-camera"></i>';
				document.getElementById('screenshotBtn').title = "Take Screenshot";
				canvas.style.cursor = "default";

				// Remove selection rectangle if exists
				if (selectionRectangle) {
					selectionRectangle.remove();
					selectionRectangle = null;
				}

				isSelectingScreenshot = false;
			}
		}

		// Start screenshot selection
		function startScreenshotSelection(event) {
			isSelectingScreenshot = true;

			const rect = canvas.getBoundingClientRect();
			screenshotStartX = snapToPixelGrid(event.clientX - rect.left, position[0]);
			screenshotStartY = snapToPixelGrid(event.clientY - rect.top, position[1]);

			// Create selection rectangle
			if (selectionRectangle) {
				selectionRectangle.remove();
			}

			selectionRectangle = document.createElement('div');
			selectionRectangle.className = 'selection-rectangle';
			selectionRectangle.style.left = screenshotStartX + 'px';
			selectionRectangle.style.top = screenshotStartY + 'px';
			selectionRectangle.style.width = '0px';
			selectionRectangle.style.height = '0px';

			document.body.appendChild(selectionRectangle);
		}

		// Update screenshot selection
		function updateScreenshotSelection(event) {
			if (!isSelectingScreenshot) return;

			const rect = canvas.getBoundingClientRect();
			screenshotEndX = snapToPixelGrid(event.clientX - rect.left, position[0]);
			screenshotEndY = snapToPixelGrid(event.clientY - rect.top, position[1]);

			const left = Math.min(screenshotStartX, screenshotEndX);
			const top = Math.min(screenshotStartY, screenshotEndY);
			const width = Math.abs(screenshotEndX - screenshotStartX);
			const height = Math.abs(screenshotEndY - screenshotStartY);

			selectionRectangle.style.left = left + 'px';
			selectionRectangle.style.top = top + 'px';
			selectionRectangle.style.width = width + 'px';
			selectionRectangle.style.height = height + 'px';

			// Update info display
			document.getElementById('screenshotInfo').textContent =
				`Selection: ${Math.round(width * (1 / zoom))}×${Math.round(height * (1 / zoom))} pixels`;
		}

		// End screenshot selection
		function endScreenshotSelection() {
			if (!isSelectingScreenshot) return;

			isSelectingScreenshot = false;

			// Ensure we have a valid selection
			const width = Math.abs(screenshotEndX - screenshotStartX);
			const height = Math.abs(screenshotEndY - screenshotStartY);

			if (width < 10 || height < 10) {
				// Selection too small, remove it
				if (selectionRectangle) {
					selectionRectangle.remove();
					selectionRectangle = null;
				}
				return;
			}
		}

		// Download the selected region
		async function downloadScreenshot() {
			if (!selectionRectangle) return;

			// Calculate the actual pixel coordinates (not zoomed)
			const left = parseInt(selectionRectangle.style.left);
			const top = parseInt(selectionRectangle.style.top);
			const width = parseInt(selectionRectangle.style.width);
			const height = parseInt(selectionRectangle.style.height);

			// Convert screen coordinates to world coordinates
			const worldX = position[0] + (left * (1 / zoom));
			const worldY = position[1] + (top * (1 / zoom));
			const worldWidth = width * (1 / zoom);
			const worldHeight = height * (1 / zoom);

			// Create an offscreen canvas with the actual pixel dimensions
			const screenshotCanvas = document.createElement('canvas');
			screenshotCanvas.width = Math.round(worldWidth);
			screenshotCanvas.height = Math.round(worldHeight);
			const screenshotCtx = screenshotCanvas.getContext('2d');
			screenshotCtx.imageSmoothingEnabled = false;

			// Determine which chunks we need to capture
			const minChunkX = Math.floor(worldX / 1000);
			const minChunkY = Math.floor(worldY / 1000);
			const maxChunkX = Math.floor((worldX + worldWidth) / 1000);
			const maxChunkY = Math.floor((worldY + worldHeight) / 1000);

			const formattedDate = formatDateForURL(selectedDate, selectedHour);

			// Draw each chunk that intersects with our selection
			for (let chunkY = minChunkY; chunkY <= maxChunkY; chunkY++) {
				for (let chunkX = minChunkX; chunkX <= maxChunkX; chunkX++) {
					try {
						const chunkImg = await get_chunk(chunkX, chunkY, formattedDate);

						// Calculate the position of this chunk relative to our selection
						const chunkWorldX = chunkX * 1000;
						const chunkWorldY = chunkY * 1000;

						// Calculate the intersection between the chunk and our selection
						const sourceX = Math.max(0, worldX - chunkWorldX);
						const sourceY = Math.max(0, worldY - chunkWorldY);
						const sourceWidth = Math.min(1000 - sourceX, (worldX + worldWidth) - (chunkWorldX + sourceX));
						const sourceHeight = Math.min(1000 - sourceY, (worldY + worldHeight) - (chunkWorldY + sourceY));

						// Calculate where to draw this part in our screenshot canvas
						const destX = chunkWorldX + sourceX - worldX;
						const destY = chunkWorldY + sourceY - worldY;

						// Draw the portion of the chunk that's in our selection
						screenshotCtx.drawImage(
							chunkImg,
							sourceX, sourceY, sourceWidth, sourceHeight,
							destX, destY, sourceWidth, sourceHeight
						);
					} catch (e) {
						// Draw error pattern for missing chunks
						const chunkWorldX = chunkX * 1000;
						const chunkWorldY = chunkY * 1000;

						const sourceX = Math.max(0, worldX - chunkWorldX);
						const sourceY = Math.max(0, worldY - chunkWorldY);
						const sourceWidth = Math.min(1000 - sourceX, (worldX + worldWidth) - (chunkWorldX + sourceX));
						const sourceHeight = Math.min(1000 - sourceY, (worldY + worldHeight) - (chunkWorldY + sourceY));

						const destX = chunkWorldX + sourceX - worldX;
						const destY = chunkWorldY + sourceY - worldY;

						// Draw the error pattern
						screenshotCtx.fillStyle = "#fb3ef9";
						screenshotCtx.fillRect(destX, destY, sourceWidth / 2, sourceHeight / 2);
						screenshotCtx.fillRect(destX + sourceWidth / 2, destY + sourceHeight / 2, sourceWidth / 2, sourceHeight / 2);

						screenshotCtx.fillStyle = "#000000";
						screenshotCtx.fillRect(destX + sourceWidth / 2, destY, sourceWidth / 2, sourceHeight / 2);
						screenshotCtx.fillRect(destX, destY + sourceHeight / 2, sourceWidth / 2, sourceHeight / 2);
					}
				}
			}

			// Create download link
			const link = document.createElement('a');
			link.download = `wplace-screenshot-${selectedDate}-${selectedHour}.png`;
			link.href = screenshotCanvas.toDataURL('image/png');
			document.body.appendChild(link);
			link.click();
			document.body.removeChild(link);

			// Exit screenshot mode
			toggleScreenshotMode();
		}

		// Cancel screenshot
		function cancelScreenshot() {
			toggleScreenshotMode();
		}

		document.getElementById("downloadScreenshot").addEventListener("click", downloadScreenshot);
		document.getElementById("cancelScreenshot").addEventListener("click", cancelScreenshot);

		// ========================= Controls =========================
		// Update the display of current date and time
		function updateDateTimeDisplay(dateStr, hour) {
			const date = new Date(dateStr);
			const formattedDate = date.toLocaleDateString(undefined, {
				year: 'numeric',
				month: 'short',
				day: 'numeric'
			});

			const timeStr = `${hour.toString().padStart(2, '0')}:00`;

			document.getElementById('currentDate').textContent = formattedDate;
			document.getElementById('currentTime').textContent = timeStr;
		}

		// Update the archive view
		function updateArchiveView() {
			context.clearRect(0, 0, canvas.width, canvas.height);
			paint();
		}

		// Initialize archive controls
		function initArchiveControls() {
			const datePicker = document.getElementById('datePicker');
			const hourSlider = document.getElementById('hourSlider');
			const hourDisplay = document.getElementById('hourDisplay');
			const prevDayBtn = document.getElementById('prevDay');
			const prevHourBtn = document.getElementById('prevHour');
			const nextHourBtn = document.getElementById('nextHour');
			const nextDayBtn = document.getElementById('nextDay');
			const compactHeader = document.getElementById('compactHeader');
			const collapseBtn = document.getElementById('collapseBtn');
			const controlsContent = document.getElementById('controlsContent');
			const screenshotBtn = document.getElementById('screenshotBtn');

			// Set initial values
			datePicker.value = selectedDate;
			datePicker.min = to_basic_date(min_date);
			hourSlider.value = selectedHour;
			updateHourDisplay(selectedHour);
			updateDateTimeDisplay(selectedDate, selectedHour);

			// Collapse state
			let isCollapsed = false;

			// Update hour display
			function updateHourDisplay(hour) {
				hourDisplay.textContent = `${hour.toString().padStart(2, '0')}:00`;
			}

			// Event listeners
			datePicker.addEventListener('change', function() {
				selectedDate = this.value;
				updateDateTimeDisplay(selectedDate, parseInt(hourSlider.value));
				updateArchiveView();
			});

			hourSlider.addEventListener('input', function() {
				const hour = parseInt(this.value);
				updateHourDisplay(hour);
				selectedHour = hour;
				updateDateTimeDisplay(selectedDate, hour);
				updateArchiveView();
			});

			prevDayBtn.addEventListener('click', function() {
				const date = new Date(selectedDate);
				date.setDate(date.getDate() - 1);
				selectedDate = date.toISOString().split('T')[0];
				datePicker.value = selectedDate;
				updateDateTimeDisplay(selectedDate, parseInt(hourSlider.value));
				updateArchiveView();
			});

			nextDayBtn.addEventListener('click', function() {
				const date = new Date(selectedDate);
				date.setDate(date.getDate() + 1);
				selectedDate = date.toISOString().split('T')[0];
				datePicker.value = selectedDate;
				updateDateTimeDisplay(selectedDate, parseInt(hourSlider.value));
				updateArchiveView();
			});

			prevHourBtn.addEventListener('click', function() {
				let newHour = parseInt(hourSlider.value) - 1;
				if (newHour < 0) {
					newHour = 23;
					// Also go to previous day
					const date = new Date(selectedDate);
					date.setDate(date.getDate() - 1);
					selectedDate = date.toISOString().split('T')[0];
					datePicker.value = selectedDate;
				}
				hourSlider.value = newHour;
				updateHourDisplay(newHour);
				selectedHour = newHour;
				updateDateTimeDisplay(selectedDate, newHour);
				updateArchiveView();
			});

			nextHourBtn.addEventListener('click', function() {
				let newHour = parseInt(hourSlider.value) + 1;
				if (newHour > 23) {
					newHour = 0;
					// Also go to next day
					const date = new Date(selectedDate);
					date.setDate(date.getDate() + 1);
					selectedDate = date.toISOString().split('T')[0];
					datePicker.value = selectedDate;
				}
				hourSlider.value = newHour;
				updateHourDisplay(newHour);
				selectedHour = newHour;
				updateDateTimeDisplay(selectedDate, newHour);
				updateArchiveView();
			});

			compactHeader.addEventListener('click', function() {
				toggleCollapse();
			});

			screenshotBtn.addEventListener('click', function() {
				toggleScreenshotMode();
			});

			function toggleCollapse() {
				isCollapsed = !isCollapsed;

				if (isCollapsed) {
					controlsContent.classList.add('collapsed');
					collapseBtn.innerHTML = '<i class="fas fa-chevron-up"></i>';
					collapseBtn.title = "Expand controls";
				} else {
					controlsContent.classList.remove('collapsed');
					collapseBtn.innerHTML = '<i class="fas fa-chevron-down"></i>';
					collapseBtn.title = "Collapse controls";
				}
			}

			// Auto-hide controls when mouse is idle
			let hideTimeout;
			document.addEventListener('mousemove', resetHideTimeout);

			function resetHideTimeout() {
				clearTimeout(hideTimeout);
				controls.classList.remove('hidden');
				hideTimeout = setTimeout(() => {
					if (isCollapsed) {
						controls.classList.add('hidden');
					}
				}, 3000);
			}

			// Initialize auto-hide functionality
			resetHideTimeout();
		}
		// Initialize archive controls
		initArchiveControls();
	</script>
</head>

<body>
	<canvas id="drawing_canvas"></canvas>
	<div class="controls-overlay auto-hide" id="controls">
		<div class="compact-header" id="compactHeader">
			<div class="header-content">
				<div class="date-display" id="currentDate">Loading...</div>
				<div class="time-display" id="currentTime">Loading...</div>
			</div>
			<button class="collapse-btn" id="collapseBtn" title="Collapse controls">
				<i class="fas fa-chevron-down"></i>
			</button>
		</div>

		<div class="controls-content" id="controlsContent">
			<div class="navigation">
				<button class="nav-btn" id="prevDay" title="Previous Day">
					<i class="fas fa-chevron-double-left"></i> Day
				</button>
				<button class="nav-btn" id="prevHour" title="Previous Hour">
					<i class="fas fa-chevron-left"></i> Hour
				</button>
				<button class="nav-btn" id="nextHour" title="Next Hour">
					Hour <i class="fas fa-chevron-right"></i>
				</button>
				<button class="nav-btn" id="nextDay" title="Next Day">
					Day <i class="fas fa-chevron-double-right"></i>
				</button>
			</div>

			<div class="date-selectors">
				<div class="date-selector">
					<label for="datePicker"><i class="fas fa-calendar-alt"></i> Date:</label>
					<input type="date" id="datePicker">
				</div>

				<div class="hour-slider-container">
					<label><i class="fas fa-clock"></i> Hour:</label>
					<div class="hour-slider-wrapper">
						<div class="hour-slider-wrapper-inner">
							<input type="range" min="0" max="23" value="12" class="hour-slider" id="hourSlider">
							<div class="hour-ticks">
								<span>0</span>
								<span>6</span>
								<span>12</span>
								<span>18</span>
								<span>23</span>
							</div>
						</div>
						<div class="hour-display" id="hourDisplay">12:00</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Screenshot Tool -->
	<button class="screenshot-btn" id="screenshotBtn" title="Take Screenshot">
		<i class="fas fa-camera"></i>
	</button>

	<div class="screenshot-tool" id="screenshotTool">
		<div class="screenshot-controls">
			<div class="screenshot-info" id="screenshotInfo">
				Drag to select a region
			</div>
			<div class="screenshot-btns">
				<button id="downloadScreenshot">Download</button>
				<button id="cancelScreenshot">Cancel</button>
			</div>
		</div>
	</div>
</body>
